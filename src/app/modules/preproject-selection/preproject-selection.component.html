<div class="app-preproject-selection">
  <div class="header-container">
    <div class="app-content-header">
      <span>{{ 'preprojectSelection' | translate }}</span>
    </div>
  </div>

  <app-card [properties]="activationCardProperties" class="mt-0 activation-card">
  </app-card>

  <div class="preproject-config-section" [class.preproject-config-disabled]="!preprojectSelectionEnabled"
    [attr.aria-disabled]="!preprojectSelectionEnabled" [attr.inert]="!preprojectSelectionEnabled ? '' : null">
  <app-card [properties]="cardProperties" class="mt-0 preproject-selection-card">
    <p-dataView
      [value]="criteriaCardItems"
      layout="grid"
      class="app-dataview"
      [paginator]="true"
      [rows]="pageSize"
      [showJumpToPageDropdown]="true"
      [showPageLinks]="false"
      [totalRecords]="totalRecords"
    >
      <ng-template let-cardItem pTemplate="gridItem">
        <div class="p-col-12 p-sm-12 p-md-4 p-lg-3 card-item-container">
          <app-card-item [properties]="cardItem"></app-card-item>
        </div>
      </ng-template>
    </p-dataView>

  </app-card>

  <app-card [properties]="evaluationCardProperties" class="mt-0 evaluation-card">
    <div class="evaluation-operation">
      <span class="p-float-label evaluation-operation-field">
        <p-dropdown
          inputId="preproject-evaluation-operation"
          class="app-single-selection"
          [options]="evaluationOperations"
          [(ngModel)]="selectedEvaluationOperation"
          dropdownIcon="fas fa-caret-down"
          [disabled]="!preprojectSelectionEnabled"
          (ngModelChange)="handleEvaluationOperationChange($event)"
        ></p-dropdown>
        <label class="app-input-label" for="preproject-evaluation-operation">
          {{ 'operation' | translate }}
        </label>
      </span>
    </div>
  </app-card>
  </div>

  <app-buttons-container [inline]="true">
    <app-save-button [form]="configurationForm" [pTooltip]="'save' | translate" (save)="saveConfiguration()"></app-save-button>
    <app-cancel-button [form]="configurationForm" (cancel)="undoConfiguration()"></app-cancel-button>
  </app-buttons-container>
</div>
