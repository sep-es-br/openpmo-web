<div class="app-preproject">
  <app-preproject-toolbar>
  </app-preproject-toolbar>

  <div class="card-preprojects">
    <app-card
      class="mt-0"
      [properties]="cardProperties"
      (createNewElement)="handleCreatePreproject()">
      <div
        *ngIf="!cardProperties.initialStateCollapse"
        card-header-actions
        class="preproject-status-filter"
        (click)="$event.stopPropagation()">
        <span class="preproject-status-filter-label">{{ 'status' | translate }}</span>
        <p-dropdown
          class="app-single-selection"
          [options]="statusFilterOptions"
          [(ngModel)]="selectedStatus"
          [autoDisplayFirst]="false"
          dropdownIcon="fas fa-caret-down"
          appendTo="body"
          (onChange)="handleStatusFilterChange($event.value)">
        </p-dropdown>
      </div>

      <p-dataView
        *ngIf="displayMode === 'grid' || (displayMode === 'list' && responsive)"
        class="app-dataview preproject-dataview-grid"
        layout="grid"
        [value]="preprojects"
        [paginator]="true"
        [rows]="pageSize"
        [showJumpToPageDropdown]="true"
        [showPageLinks]="false"
        [emptyMessage]="'notFoundPreprojects' | translate">
        <ng-template let-cardItem pTemplate="gridItem">
          <div class="p-col-12 p-md-3 p-sm-12 card-item-container preproject-grid-card">
            <app-card-item
              [properties]="cardItem"
              displayModeCard="grid">
            </app-card-item>
          </div>
        </ng-template>
      </p-dataView>

      <p-dataView
        *ngIf="displayMode === 'list' && !responsive"
        class="app-dataview app-dataview-list preproject-dataview-list"
        layout="list"
        [value]="preprojects"
        [paginator]="true"
        [rows]="pageSize"
        [showJumpToPageDropdown]="true"
        [showPageLinks]="false"
        [emptyMessage]="'notFoundPreprojects' | translate">
        <ng-template let-cardItem pTemplate="listItem">
          <div class="p-col-12">
            <app-card-item
              [properties]="cardItem"
              [displayModeCard]="displayMode">
            </app-card-item>
          </div>
        </ng-template>
      </p-dataView>
    </app-card>
  </div>
</div>
